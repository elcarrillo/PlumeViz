[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plumeviz"
version = "0.2.0.dev0"
description = "Tools for running, processing, and visualizing Plumeria volcanic plume simulations."
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "seaborn>=0.12",
    "colormaps>=0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

web = [
    "streamlit>=1.39",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: tests that run the real plumeria engine",
]

[project.scripts]
plumeviz = "plumeviz.cli:main"
